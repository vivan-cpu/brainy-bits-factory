name: Brainy Bits factory

on:
  schedule:
    # 4 Shorts a day (long videos were dropped on 20 Nov 2026). GitHub starts this repo's schedule 7 to 11 hours late
    # (00:30 ran at about 07:00, 08:30 ran at about 19:20), so 02:30 UTC really starts between 09:30 and 13:30 UTC:
    # after the free Gemini quota resets (08:00 UTC) and before the first publish slot (15:00 UTC).
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many Shorts to make'
        default: '1'
      topic:
        description: 'Optional topic for the first Short (leave empty = Brainy picks)'
        default: ''

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0

      - name: Cache Whisper model (lines up the Gemini voice with the captions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1 kokoro-onnx soundfile faster-whisper
          mkdir -p ~/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f ~/kokoro/kokoro-v1.0.onnx ] || curl -sSL -o ~/kokoro/kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          [ -f ~/kokoro/voices-v1.0.bin ] || curl -sSL -o ~/kokoro/voices-v1.0.bin $B/voices-v1.0.bin
          npm ci

      - name: Make Shorts (script -> fact-check -> voice -> animation -> QA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON: python
          COUNT: ${{ github.event.inputs.count || '4' }}
          TOPIC: ${{ github.event.inputs.topic }}
          RENDER_CONCURRENCY: '100%'
          BRAINY_TTS: auto
        run: node factory/run.mjs --count "$COUNT" --topic "$TOPIC"

      - name: Remember used topics
        if: always()
        run: |
          git config user.name "brainy-bot"
          git config user.email "brainy-bot@users.noreply.github.com"
          git add data/history.json data/refurbish.json
          git diff --cached --quiet || (git commit -m "history: topics from run ${{ github.run_number }}" && (git push || (git pull --rebase && git push)))

      - name: Publish the Shorts as a release (download them on your phone)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shorts-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/*.mp4 --title "Brainy Bits $(date -u +'%d %b %Y %H:%M') UTC" --notes-file out/release-notes.md

      - name: Upload to YouTube (only when YouTube secrets are set)
        # Runs only when repo variable YT_UPLOAD=1. YT_PRIVACY sets the visibility, and YT_SCHEDULE=1 publishes them at fixed hours (see SLOTS in factory/youtube.mjs).
        if: success() && env.HAS_YT == 'true' && vars.YT_UPLOAD == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          YT_SCHEDULE: ${{ vars.YT_SCHEDULE || '1' }}
        run: node factory/youtube.mjs

  # Hindi channel "Brainyvoo Hindi": 4 Hindi Shorts a day, in its own job so it never slows down or breaks the English one.
  # OFF until the repo variable HINDI=1 is set. It also needs the secret YT_REFRESH_TOKEN_HI (the Hindi channel's sign-in)
  # and the repo variables YT_HANDLE_HI (its @handle, without @) and YT_CHANNEL_ID_HI (its UC... id).
  # checks that the Hindi sign-in secret exists, so HINDI=1 can be set before it is pasted without wasting the Gemini quota
  hi-gate:
    if: vars.HINDI == '1' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: echo "ok=${{ secrets.YT_REFRESH_TOKEN_HI != '' }}" >> "$GITHUB_OUTPUT"

  make-hi:
    needs: hi-gate
    if: needs.hi-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN_HI != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0

      - name: Cache Whisper model (lines up the Gemini voice with the captions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1 kokoro-onnx soundfile faster-whisper
          mkdir -p ~/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f ~/kokoro/kokoro-v1.0.onnx ] || curl -sSL -o ~/kokoro/kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          [ -f ~/kokoro/voices-v1.0.bin ] || curl -sSL -o ~/kokoro/voices-v1.0.bin $B/voices-v1.0.bin
          npm ci

      - name: Make Hindi Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON: python
          RENDER_CONCURRENCY: '100%'
          BRAINY_TTS: auto
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID_HI }}
        run: node factory/run.mjs --lang hi --count "${{ vars.HINDI_COUNT || '4' }}"

      - name: Remember used Hindi topics
        if: always()
        run: |
          git config user.name "brainy-bot"
          git config user.email "brainy-bot@users.noreply.github.com"
          git add data/history-hi.json
          git diff --cached --quiet || (git commit -m "history-hi: topics from run ${{ github.run_number }}" && (git push || (git pull --rebase && git push)))

      - name: Publish the Hindi Shorts as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hindi-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/*.mp4 --title "Brainyvoo Hindi $(date -u +'%d %b %Y %H:%M') UTC" --notes-file out/release-notes.md

      - name: Upload to the Hindi channel
        # Same publish hours as English (SLOTS in factory/youtube.mjs): 06:00, 10:00, 14:00, 18:00 IST.
        if: success() && env.HAS_YT == 'true' && vars.YT_UPLOAD == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_HI }}
          YT_LANG: hi
          YT_HANDLE: ${{ vars.YT_HANDLE_HI }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          YT_SCHEDULE: ${{ vars.YT_SCHEDULE || '1' }}
        run: node factory/youtube.mjs
