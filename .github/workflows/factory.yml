name: Brainy Bits factory

on:
  schedule:
    - cron: '30 0 * * *'   # every day 06:00 India time (GitHub can start it hours late) -> 4 Shorts + 1 long video
  workflow_dispatch:
    inputs:
      count:
        description: 'How many Shorts to make'
        default: '1'
      topic:
        description: 'Optional topic for the first Short (leave empty = Brainy picks)'
        default: ''
      long:
        description: 'Also make the long video (1 = yes)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1 kokoro-onnx soundfile
          mkdir -p ~/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f ~/kokoro/kokoro-v1.0.onnx ] || curl -sSL -o ~/kokoro/kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          [ -f ~/kokoro/voices-v1.0.bin ] || curl -sSL -o ~/kokoro/voices-v1.0.bin $B/voices-v1.0.bin
          npm ci

      - name: Make Shorts (script -> fact-check -> voice -> animation -> QA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON: python
          COUNT: ${{ github.event.inputs.count || '4' }}
          TOPIC: ${{ github.event.inputs.topic }}
          RENDER_CONCURRENCY: '100%'
          BRAINY_TTS: auto
        run: node factory/run.mjs --count "$COUNT" --topic "$TOPIC"

      - name: Make the daily long video (3-4 minutes, 16:9)
        # Monday, Wednesday and Saturday. Never blocks the Shorts: if it fails or runs out of time, the Shorts still upload.
        if: github.event_name == 'schedule' || github.event.inputs.long == '1'
        continue-on-error: true
        timeout-minutes: 80
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON: python
          RENDER_CONCURRENCY: '100%'
          BRAINY_TTS: auto
        run: |
          # long videos go out on Monday, Wednesday and Saturday (a manual run with long=1 always makes one)
          DAY=$(date -u +%u)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DAY" != "1" ] && [ "$DAY" != "3" ] && [ "$DAY" != "6" ]; then echo "no long video today"; exit 0; fi
          node factory/run.mjs --long

      - name: Remember used topics
        if: always()
        run: |
          git config user.name "brainy-bot"
          git config user.email "brainy-bot@users.noreply.github.com"
          git add data/history.json data/refurbish.json
          git diff --cached --quiet || (git commit -m "history: topics from run ${{ github.run_number }}" && git push)

      - name: Publish the Shorts as a release (download them on your phone)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shorts-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/*.mp4 --title "Brainy Bits $(date -u +'%d %b %Y %H:%M') UTC" --notes-file out/release-notes.md

      - name: Upload to YouTube (only when YouTube secrets are set)
        # Runs only when repo variable YT_UPLOAD=1. YT_PRIVACY sets the visibility, and YT_SCHEDULE=1 spaces the day's Shorts 3 hours apart.
        if: success() && env.HAS_YT == 'true' && vars.YT_UPLOAD == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          YT_SCHEDULE: ${{ vars.YT_SCHEDULE || '1' }}
        run: node factory/youtube.mjs
